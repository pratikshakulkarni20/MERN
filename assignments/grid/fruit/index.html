<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(251, 252, 252);
            padding: 30px;
        }

        .grid-container {
            width: 100%;
            max-width: 700px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 150px 220px 190px;

            gap: 12px;
        }

        .grid-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Top two small images */
        .Mango {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
        }

        .Watermelon {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }

        /* Large orange image */
        .Pineapple {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
        }

        /* Large watermelon image */
        .Apple {
            grid-column: 3 / 5;
            grid-row: 1 / 3;
        }

        /* Bottom left image */
        .Papaya {
            grid-column: 1 / 3;
            grid-row: 3 / 4;
        }

        /* Bottom right image */
        .Grapes {
            grid-column: 3 / 5;
            grid-row: 3 / 4;
        }

    </style>
</head>
<body>
    
    <div class="grid-container">
        <div class="Mango">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZiI4aiZDZa_zcAmp29nuK5YcJroJf2Mh7k3Kyo9U6OtJ5sdMYkGojvlfO&s=10 alt="">
        </div>

        <div class="Watermelon">
            <img src="https://centershealthcare.com/wp-content/uploads/2022/04/Watermelon.webp" alt="">
        </div>


        <div class="Pineapple">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRs0JV2l413kfz-WRTRBbf4Nr_iLp5RbzJg1jHtpdJnLaOTJas12EZS-gUQ&s=10" alt="">
        </div>

        <div class="Apple">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQuJnx2jZzaPGA0bQtzkm2_fT1vfUgZ158hYBfrmi1rtw&s=10" alt="">
        </div>

        <div class="Papaya">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRAw7tzbbtqCpkng7RFhJmPWvMwsG6nmS3ub4UNeBkPxw&s=10" alt="">
        </div>

        <div class="Grapes">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTA2fWBFAQU9psJydsAFm3Qyexg3rH2AgZhoZkqMmk8qA&s=10" alt="">

    </div>
       
     

    
</body>
</html>
